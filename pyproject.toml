[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: HTTP-проверки приложения по исходному OpenAPI",
    "unit: Проверки отдельных функций и модулей",
]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".tools", "generated/dto.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
